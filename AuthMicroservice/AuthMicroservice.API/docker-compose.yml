services:
  postgres:
    image: postgres:latest
    container_name: auth_postgres
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: authdb
    ports:
      - "5430:5432"

  redis:
    image: redis:latest
    container_name: auth_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
    driver: local